<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="paperA" x1="10" y1="8" x2="53" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff9ec"/>
      <stop offset=".52" stop-color="#f6e9cf"/>
      <stop offset="1" stop-color="#e8d5b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#3a2618" flood-opacity=".25"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <clipPath id="clip"><rect x="7" y="7" width="50" height="50" rx="9"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="7" y="7" width="50" height="50" rx="9" fill="url(#paperA)" stroke="#c7ad84" stroke-width="1.15"/>
    <rect x="9.3" y="9.3" width="45.4" height="45.4" rx="7.2" fill="none" stroke="#fffdf7" stroke-opacity=".78" stroke-width=".8"/>
    <rect x="11" y="11" width="42" height="42" rx="6.2" fill="none" stroke="#b99669" stroke-opacity=".22" stroke-width=".7"/>
  </g>
  <g clip-path="url(#clip)" filter="url(#grain)" opacity=".72"><rect x="7" y="7" width="50" height="50" fill="#6d5338"/></g>
</svg>
