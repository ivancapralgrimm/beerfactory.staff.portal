<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="leather" x1="12" y1="8" x2="51" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5231"/>
      <stop offset=".5" stop-color="#6f3d24"/>
      <stop offset="1" stop-color="#4c2919"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.3" flood-color="#24140d" flood-opacity=".38"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".33" numOctaves="3" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    </filter>
    <clipPath id="clip"><rect x="7" y="7" width="50" height="50" rx="9"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="7" y="7" width="50" height="50" rx="9" fill="url(#leather)" stroke="#a76c43" stroke-width="1.2"/>
    <rect x="9.4" y="9.4" width="45.2" height="45.2" rx="7.1" fill="none" stroke="#d59a68" stroke-opacity=".42" stroke-width=".85"/>
    <rect x="11.2" y="11.2" width="41.6" height="41.6" rx="6" fill="none" stroke="#e3b27e" stroke-opacity=".28" stroke-width=".7" stroke-dasharray="2.6 2.4"/>
  </g>
  <g clip-path="url(#clip)" filter="url(#grain)" opacity=".8"><rect x="7" y="7" width="50" height="50" fill="#24140d"/></g>
</svg>
