<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#160b07"><title>BeerFactory — Аттестация</title><link rel="stylesheet" href="styles.css"></head>
<body class="quiz-page" data-page="quiz">
<div class="quiz-card">
  <div id="start-screen"><div class="tag">Аттестация</div><h1>Проверка знаний</h1><p id="start-desc">Загрузка вопросов из базы...</p><div class="btn-group"><button class="apple-btn" id="start-btn" disabled>Начать</button><button class="apple-btn apple-btn-secondary" id="back-to-training">Вернуться в обучение</button></div></div>
  <div id="quiz-screen" class="hidden"><div class="tag" id="question-progress">Вопрос 1</div><h2 id="question-text">Текст вопроса</h2><ul class="options-list" id="options-container"></ul><button class="apple-btn" id="next-btn" disabled>Ответить</button></div>
  <div id="result-screen" class="hidden"><div class="tag">Результат</div><div id="score-percentage" class="score-badge">0%</div><h1 id="result-title">Завершено</h1><p id="result-subtitle"></p><div id="errors-container" class="errors-summary hidden"><h3>Сводка ошибок</h3><div id="errors-list"></div></div><div class="btn-group" id="action-buttons"></div></div>
</div>
<script src="script.js"></script>
